spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:ChangeThisSecretToALongSecureValueForProduction123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.upload-dir=${UPLOAD_DIR:uploads}
app.storage.s3.region=${AWS_REGION:ap-south-1}
app.storage.s3.bucket=${AWS_S3_BUCKET:ecommerce-assets}
app.storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.s3.endpoint=${AWS_S3_ENDPOINT:}
app.storage.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.storage.s3.key-prefix=${AWS_S3_KEY_PREFIX:ecommerce}
app.storage.s3.path-style-access=${AWS_S3_PATH_STYLE:false}

spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

spring.session.store-type=${SESSION_STORE_TYPE:none}
spring.session.redis.namespace=${REDIS_SESSION_NAMESPACE:ecommerce:session}
server.servlet.session.timeout=30m

app.cache.ttl-seconds=${CACHE_TTL_SECONDS:120}
app.cache.products-ttl-seconds=${CACHE_PRODUCTS_TTL_SECONDS:60}
app.cache.banners-ttl-seconds=${CACHE_BANNERS_TTL_SECONDS:30}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX_REQUESTS:20}
app.rate-limit.cart.max-requests=${RATE_LIMIT_CART_MAX_REQUESTS:180}
app.rate-limit.checkout.max-requests=${RATE_LIMIT_CHECKOUT_MAX_REQUESTS:30}
